name: academic-platform
services:
  db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_DB: academic
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Missing server secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40", "-c", "work_mem=4MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic -d academic"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
  api:
    networks: [default, edge]
    image: ${API_IMAGE:?Missing immutable release image}
    environment:
      APP_DEMO: "false"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Missing server secret}
      DB_URL: jdbc:postgresql://db:5432/academic
      DB_USER: academic
      DB_PASSWORD: ${DB_PASSWORD:?Missing server secret}
      DB_POOL_SIZE: "8"
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_ADDRESS: 0.0.0.0
      CRAWL_WORKER_ENABLED: "true"
      CRAWL_POLL_MS: "2000"
      CRAWL_CONTACT_EMAIL: ${CRAWL_CONTACT_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
  gateway:
    image: nginx:stable-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/edge:/etc/academic-tls:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    restart: unless-stopped
networks:
  edge:
volumes:
  pgdata:
