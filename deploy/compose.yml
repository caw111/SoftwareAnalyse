name: academic-platform
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: academic
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40", "-c", "work_mem=4MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic -d academic"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
  api:
    build: ../backend
    image: academic-platform-api:0.3.0
    environment:
      APP_DEMO: "false"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DB_URL: jdbc:postgresql://db:5432/academic
      DB_USER: academic
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_POOL_SIZE: "8"
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_ADDRESS: 0.0.0.0
      CRAWL_WORKER_ENABLED: ${CRAWL_WORKER_ENABLED:-true}
      CRAWL_POLL_MS: ${CRAWL_POLL_MS:-2000}
      CRAWL_CONTACT_EMAIL: ${CRAWL_CONTACT_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
volumes:
  pgdata:
