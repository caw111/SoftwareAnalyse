<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2937}.lane{stroke-width:2}.box{fill:#fff;stroke-width:2;rx:12}.diamond{fill:#fff;stroke:#666;stroke-width:2}.edge{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.label{font-size:16px}.small{font-size:14px}.title{font-size:26px;font-weight:700}.lane-title{font-size:20px;font-weight:700}.end{fill:#fff;stroke:#1f2937;stroke-width:4}
    </style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="title">科研人员个人门户认领审核流程活动图</text>
  <rect x="30" y="60" width="360" height="1320" fill="#eaf3ff" stroke="#6b9bd1" class="lane"/><rect x="390" y="60" width="420" height="1320" fill="#f4f4f4" stroke="#999" class="lane"/><rect x="810" y="60" width="360" height="1320" fill="#fff5e6" stroke="#d19a42" class="lane"/>
  <rect x="30" y="60" width="360" height="52" fill="#d6e8ff" stroke="#6b9bd1" class="lane"/><rect x="390" y="60" width="420" height="52" fill="#e8e8e8" stroke="#999" class="lane"/><rect x="810" y="60" width="360" height="52" fill="#ffe5b8" stroke="#d19a42" class="lane"/>
  <text x="210" y="94" text-anchor="middle" class="lane-title">申请人（科研人员）</text><text x="600" y="94" text-anchor="middle" class="lane-title">系统</text><text x="990" y="94" text-anchor="middle" class="lane-title">管理员</text>

  <circle cx="210" cy="145" r="11" fill="#1f2937"/>
  <rect x="90" y="185" width="240" height="58" class="box" stroke="#6b9bd1"/><text x="210" y="220" text-anchor="middle" class="label">登录并进入门户认领</text>
  <rect x="90" y="285" width="240" height="68" class="box" stroke="#6b9bd1"/><text x="210" y="313" text-anchor="middle" class="label">选择待认领门户，填写身份信息</text><text x="210" y="337" text-anchor="middle" class="label">所属机构和证明材料后提交</text>
  <rect x="90" y="485" width="240" height="58" class="box" stroke="#6b9bd1"/><text x="210" y="520" text-anchor="middle" class="label">补充或修改申请信息</text>
  <rect x="90" y="765" width="240" height="58" class="box" stroke="#6b9bd1"/><text x="210" y="800" text-anchor="middle" class="label">查看已有申请状态</text><circle cx="210" cy="865" r="11" class="end"/>
  <rect x="90" y="1110" width="240" height="58" class="box" stroke="#6b9bd1"/><text x="210" y="1145" text-anchor="middle" class="label">查看驳回理由</text><circle cx="210" cy="1225" r="11" class="end"/>
  <rect x="90" y="1280" width="240" height="58" class="box" stroke="#6b9bd1"/><text x="210" y="1315" text-anchor="middle" class="label">进入个人门户并维护成果</text><circle cx="210" cy="1360" r="11" class="end"/>

  <rect x="450" y="385" width="300" height="58" class="box" stroke="#999"/><text x="600" y="420" text-anchor="middle" class="label">校验必填信息、材料格式和权限</text>
  <polygon points="600,465 680,510 600,555 520,510" class="diamond"/><text x="600" y="515" text-anchor="middle" class="label">材料完整有效？</text>
  <rect x="450" y="585" width="300" height="58" class="box" stroke="#999"/><text x="600" y="620" text-anchor="middle" class="label">检查同一门户是否已有申请</text>
  <polygon points="600,665 680,710 600,755 520,710" class="diamond"/><text x="600" y="715" text-anchor="middle" class="label">已有申请？</text>
  <rect x="450" y="790" width="300" height="58" class="box" stroke="#999"/><text x="600" y="825" text-anchor="middle" class="label">提示已有申请并返回当前状态</text>
  <rect x="450" y="900" width="300" height="58" class="box" stroke="#999"/><text x="600" y="935" text-anchor="middle" class="label">保存申请，状态设为“待审核”</text>
  <rect x="450" y="1010" width="300" height="68" class="box" stroke="#999"/><text x="600" y="1038" text-anchor="middle" class="label">状态设为“已通过”，绑定门户</text><text x="600" y="1062" text-anchor="middle" class="label">赋予科研人员角色并通知申请人</text>
  <rect x="450" y="1155" width="300" height="58" class="box" stroke="#999"/><text x="600" y="1190" text-anchor="middle" class="label">记录驳回理由并通知申请人</text>

  <rect x="870" y="900" width="240" height="58" class="box" stroke="#d19a42"/><text x="990" y="935" text-anchor="middle" class="label">核验身份及门户资料</text>
  <polygon points="990,985 1070,1030 990,1075 910,1030" class="diamond"/><text x="990" y="1035" text-anchor="middle" class="label">认证通过？</text>
  <rect x="870" y="1100" width="240" height="58" class="box" stroke="#d19a42"/><text x="990" y="1135" text-anchor="middle" class="label">填写驳回理由</text>

  <path d="M210 156 L210 185 M210 243 L210 285 M330 319 L450 414 M600 443 L600 465 M600 555 L600 585 M600 643 L600 665 M600 755 L780 755 L780 929 L750 929 M750 929 L870 929 M990 958 L990 985 M1070 1030 L1140 1030 L1140 970 L600 970 L600 1010 M450 1044 L390 1044 L390 1309 L330 1309 M210 1338 L210 1360" class="edge"/>
  <path d="M520 510 L410 510 L410 514 L330 514 M90 514 L60 514 L60 319 L90 319" class="edge"/>
  <path d="M520 710 L410 710 L410 794 L330 794 M210 823 L210 865" class="edge"/>
  <path d="M910 1030 L830 1030 L830 1129 L870 1129 M870 1129 L810 1129 L810 1184 L750 1184 M450 1184 L390 1184 L390 1139 L330 1139 M210 1168 L210 1225" class="edge"/>
  <text x="613" y="575" class="small">是</text><text x="530" y="493" class="small">否</text><text x="485" y="775" class="small">是</text><text x="765" y="885" class="small">否</text><text x="890" y="1018" class="small">否</text><text x="1080" y="1018" class="small">是</text>
</svg>
