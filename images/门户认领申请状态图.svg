<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="620" viewBox="0 0 1380 620">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.state{fill:#eef5ff;stroke:#567da8;stroke-width:2;rx:18}.state-end{fill:#eff8ef;stroke:#5c8b62;stroke-width:2;rx:18}.state-reject{fill:#fff1ed;stroke:#b76b55;stroke-width:2;rx:18}.label{font-size:16px}.small{font-size:14px}.edge{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.initial{fill:#1f2937}.final{fill:#fff;stroke:#1f2937;stroke-width:3}
  </style></defs>
  <text x="690" y="38" text-anchor="middle" class="title">个人门户认领申请状态图</text>
  <circle cx="85" cy="230" r="11" class="initial"/>
  <rect x="190" y="180" width="250" height="100" class="state"/><text x="315" y="218" text-anchor="middle" class="label">填写中（未提交）</text><text x="315" y="244" text-anchor="middle" class="small">选择门户并填写身份、机构及证明材料</text>
  <rect x="570" y="180" width="230" height="100" class="state"/><text x="685" y="218" text-anchor="middle" class="label">待审核</text><text x="685" y="244" text-anchor="middle" class="small">申请记录已提交</text>
  <rect x="970" y="90" width="250" height="100" class="state-end"/><text x="1095" y="128" text-anchor="middle" class="label">已通过</text><text x="1095" y="154" text-anchor="middle" class="small">绑定门户并赋予科研人员权限</text>
  <rect x="970" y="300" width="250" height="100" class="state-reject"/><text x="1095" y="338" text-anchor="middle" class="label">已驳回</text><text x="1095" y="364" text-anchor="middle" class="small">记录驳回理由并通知申请人</text>
  <circle cx="1320" cy="140" r="12" class="final"/><circle cx="1320" cy="140" r="6" class="initial"/>
  <circle cx="1320" cy="350" r="12" class="final"/><circle cx="1320" cy="350" r="6" class="initial"/>
  <circle cx="315" cy="520" r="12" class="final"/><circle cx="315" cy="520" r="6" class="initial"/>
  <path d="M96 230 L190 230 M440 230 L570 230 M800 205 L875 205 L875 140 L970 140 M800 255 L875 255 L875 350 L970 350 M1220 140 L1308 140 M1220 350 L1308 350 M315 180 L315 105 L380 105 L380 180 M315 280 L315 508" class="edge"/>
  <text x="505" y="137" text-anchor="middle" class="small">提交并通过材料校验，且无重复申请</text><text x="505" y="158" text-anchor="middle" class="small">创建申请记录</text>
  <text x="875" y="122" text-anchor="middle" class="small">管理员核验通过</text>
  <text x="875" y="330" text-anchor="middle" class="small">管理员驳回</text>
  <text x="346" y="95" text-anchor="middle" class="small">材料校验失败：补充或修改后重提</text>
  <text x="380" y="445" class="small">检测到同一门户已有待审/已通过申请</text><text x="380" y="468" class="small">提示查看已有状态，不创建新申请</text>
</svg>
