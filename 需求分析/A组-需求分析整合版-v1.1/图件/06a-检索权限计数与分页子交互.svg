<text x="73" y="1598" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">立即返回读取或一致性错误；不返回部分列表，不由权限变化覆盖故障</text>
<text x="144.0" y="1685" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">QX06  返回前重验 permissionRevisio</text>
