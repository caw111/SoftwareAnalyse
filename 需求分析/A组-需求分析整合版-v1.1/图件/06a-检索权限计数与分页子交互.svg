<text x="38" y="1395" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#26384B">opt [规范ID页非空]</text>
<text x="144.0" y="1448" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">QX05  按同一release批量读公开条目和来源；核对完整性</text>
