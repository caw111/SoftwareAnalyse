<rect x="58" y="751" width="1444" height="51" fill="#F5F7FA" stroke="#D9DDE3" stroke-width="2"/>
<text x="73" y="784" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">先身份／类型／条件匹配 → 解析规范ID → 按实时可见范围过滤</text>
