<text x="144.0" y="301" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">QX01  获取当前公开可见约束与 permi</text>
<text x="144.0" y="332" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">ssionRevision</text>
