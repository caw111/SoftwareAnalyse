<text x="73" y="853" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">再计算总数与分面 → 稳定排序 → 分页；不可先分页再剔除</text>
<text x="144.0" y="920" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">QX04  返回规范ID页、total、facets与读视图标记</text>
