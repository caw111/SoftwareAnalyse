<text x="73" y="567" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">返回查询上下文冲突；保留条件，要求重新查询</text>
<text x="144.0" y="654" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">QX03  查询固定 release；同贡献筛选＋可见约束</text>
