<text x="73" y="1070" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">立即返回查询或版本错误；不作页码判断，不把故障当0条</text>
<text x="144.0" y="1157" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#26384B">QX04a  依据实际total校验页码；total=0仅page=1有效</text>
